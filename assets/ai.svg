<text x="41" y="30" fill="#FF1F8F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="700" letter-spacing="2.6">L'IA DANS MON TRAVAIL, C'EST ASSUMÉ</text>
<rect x="24.0" y="52" width="405.0" height="147.0" rx="11" fill="#12080f" stroke="#FF1F8F" stroke-opacity="0.28"/>
<rect x="24.0" y="52" width="3" height="147.0" rx="1.5" fill="#FF1F8F"/>
<text x="42.0" y="82.0" fill="#FF1F8F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" text-anchor="start">Dans mes produits</text>
<text x="42.0" y="108.0" fill="#B9AEB6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">J'intègre des modèles (Gemini, Claude). scandocs-ia</text>
<text x="42.0" y="127.0" fill="#B9AEB6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">classe automatiquement des documents scannés ;</text>
<text x="42.0" y="146.0" fill="#B9AEB6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">geo-aeo mesure la visibilité d'une marque dans les</text>
<text x="42.0" y="165.0" fill="#B9AEB6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">réponses des IA.</text>
<rect x="451.0" y="52" width="405.0" height="147.0" rx="11" fill="#12080f" stroke="#FF1F8F" stroke-opacity="0.28"/>
<rect x="451.0" y="52" width="3" height="147.0" rx="1.5" fill="#FF1F8F"/>
<text x="469.0" y="82.0" fill="#FF1F8F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" text-anchor="start">Dans ma façon de construire</text>
<text x="469.0" y="108.0" fill="#B9AEB6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">Je développe avec des outils comme Claude Code. Je</text>
<text x="469.0" y="127.0" fill="#B9AEB6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">conçois l'architecture, j'oriente, je relis et je</text>
<text x="469.0" y="146.0" fill="#B9AEB6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">livre. L'IA accélère mon travail ; les décisions</text>
<text x="469.0" y="165.0" fill="#B9AEB6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">techniques et la responsabilité du résultat restent</text>
<text x="469.0" y="184.0" fill="#B9AEB6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="400" text-anchor="start">les miennes.</text>
<rect x="24" y="217" width="832" height="46" rx="11" fill="#170b13" stroke="#FF1F8F" stroke-opacity="0.22"/>
<text x="40.0" y="251.0" fill="#FF1F8F" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="24" font-weight="700" text-anchor="start">“</text>
<text x="66.0" y="245.0" fill="#FF9ACB" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" text-anchor="start">Utiliser ces outils correctement, c'est une compétence — pas un raccourci.</text>
