name: Contributions

on:
  schedule:
    # Toutes les 12 h
    - cron: "0 */12 * * *"
  workflow_dispatch: # bouton "Run workflow" manuel
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer la heatmap des contributions
        run: python scripts/contributions.py

      - name: Committer si le graphe a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git diff --staged --quiet || git commit -m "chore: maj du graphe de contributions"
          git push
